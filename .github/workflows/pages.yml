name: Publish Solar Clock and Ordo to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - "solar-clock/**"
      - "ordo/**"
      - "shared/**"
      - "vendor/**"
      - "solar-clock.html"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public distribution
        uses: actions/checkout@v4
      - name: Assemble published files only
        run: |
          set -euo pipefail
          mkdir _site
          cp -a solar-clock ordo shared vendor _site/
          cp solar-clock.html _site/
          touch _site/.nojekyll
          test -s _site/solar-clock/index.html
          test -s _site/ordo/daily.html
          test -s _site/shared/routes.js
          test ! -e _site/.github
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
