name: Bootstrap Solar Clock and Ordo on GitHub Pages
on:
  push:
    paths:
      - .github/workflows/bootstrap-site.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the public hosting repository
        uses: actions/checkout@v4

      - name: Download the verified, public-only static distribution
        env:
          RELEASE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-37c8-81f6-bf3a-b6a839886885/raw?se=2026-11-13T19%3A24%3A38Z&sp=r&sv=2026-06-06&sr=b&scid=390856fc-0252-5dbc-bf0f-68c82eedb67a&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T17%3A51%3A43Z&ske=2026-11-14T17%3A51%3A43Z&sks=b&skv=2026-06-06&sig=QmC385uv8C/ttLVXbVO1W6TF51q3UINBgs2DuyzyQ5c%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 --output "$RUNNER_TEMP/site.zip" "$RELEASE_URL"
          echo "a952e901834b1568fa521b008bff46b00bdcc68fd1f88953968e71ad3d08ee46  $RUNNER_TEMP/site.zip" | sha256sum --check

      - name: Unpack and verify publishing boundaries
        run: |
          set -euo pipefail
          mkdir -p _site
          unzip -q "$RUNNER_TEMP/site.zip" -d _site
          test -s _site/solar-clock/index.html
          test -s _site/solar-clock/sw.js
          test -s _site/ordo/daily.html
          test -s _site/ordo/sw.js
          test -s _site/shared/routes.js
          for forbidden in src test runtime tooling provenance .github; do
            test ! -e "_site/$forbidden"
          done
          test "$(find _site -type f | wc -l)" -eq 183

      - name: Preserve the published static files in the public Git repository
        run: |
          set -euo pipefail
          cp -a _site/. .
          git add -A -- .nojekyll solar-clock.html solar-clock ordo shared vendor
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish verified Solar Clock and Ordo static release'
            git push origin HEAD:master
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages publication artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
